version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mart}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mart}
      PORT: 5000
      NODE_ENV: production
      # Required: must be a random value of >= 32 chars. The API refuses to
      # start in production with a weak/placeholder secret. Generate one with
      # e.g. `openssl rand -hex 32` and export it before running compose.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to a random value of at least 32 chars}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000,http://localhost:80}
      # Set to the number of reverse proxies in front of the API (e.g. "1") so
      # rate limiting uses the real client IP. Leave unset if exposed directly.
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
