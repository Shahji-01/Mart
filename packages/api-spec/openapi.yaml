    StoreSettingsUpdate:
      type: object
      properties:
        storeName:
          type: string
        fullName:
          type: string
        gstin:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        openingHours:
          type: string
        deliveryCutoff:
          type: string
        lowStockThreshold:
          type: integer
        freeDeliveryAbove:
          type: number
        deliveryFee:
          type: number
        socialInstagram:
          type: string
        socialFacebook:
          type: string
        socialWhatsapp:
          type: string

    # ─── Product Q&A ───────────────────────────────────────────────────────
    ProductQa:
      type: object
      required: [id, productId, userId, userName, question, answer, answeredBy, answererName, isApproved, createdAt, answeredAt]
      properties:
        id:
          type: integer
        productId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        question:
          type: string
        answer:
          type: ["string", "null"]
        answeredBy:
          type: ["integer", "null"]
        answererName:
          type: ["string", "null"]
        isApproved:
          type: boolean
        createdAt:
          type: string
        answeredAt:
          type: ["string", "null"]

    ProductQaInput:
      type: object
      required: [question]
      properties:
        question:
          type: string

    # ─── Back-in-stock notify ────────────────────────────────────────────────
    NotifyMeResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        subscribed:
          type: boolean

    # ─── Auth logout ──────────────────────────────────────────────────────────
    LogoutResult:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── Coupon suggestions ────────────────────────────────────────────────
    CouponSuggestion:
      type: object
      required: [code, discountType, discountValue, minOrderValue, description]
      properties:
        code:
          type: string
        discountType:
          type: string
          enum: [percentage, flat]
        discountValue:
          type: number
        maxDiscount:
          type: ["number", "null"]
        minOrderValue:
          type: number
        description:
          type: string
        expiresAt:
          type: ["string", "null"]

    # ─── Reorder ───────────────────────────────────────────────────────────
    ReorderResult:
      type: object
      required: [message, count]
      properties:
        message:
          type: string
        count:
          type: integer
